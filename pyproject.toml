[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatsom-publication"
version = "0.1.0"
description = "FloatSOM publication benchmarks and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "floatsom>=0.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tifffile>=2023.0.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
    "ray[default]>=2.6.0",
    "zarr>=3.0.0",
    "h5py>=3.9.0",
    "networkx>=3.1",
    "scikit-learn>=1.3.0",
    "plotly>=5.14.0",
    "seaborn>=0.12.0",
    "PyWavelets>=1.4.0",
    "ptwt>=0.1.0",
    "psutil>=5.9.0",
    "minisom>=2.3.0",
    "optuna>=3.3.0",
]

[project.urls]
Repository = "https://github.com/1ordinateur/floatsom-publication"
Software = "https://github.com/1ordinateur/floatsom"

[project.optional-dependencies]
cuda12 = ["floatsom[cuda12]>=0.1.0"]
cuda13 = ["floatsom[cuda13]>=0.1.0"]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools]
include-package-data = true
packages = [
    "floatsom_benchmarks",
    "floatsom_benchmarks.evaluation",
    "floatsom_benchmarks.mst_comparison",
    "floatsom_benchmarks.optuna",
    "floatsom_benchmarks.optuna.analysis",
    "floatsom_benchmarks.optuna.config",
    "floatsom_benchmarks.optuna.core",
    "floatsom_benchmarks.optuna.harmonization",
    "floatsom_benchmarks.optuna.optuna_results_analysis",
    "floatsom_benchmarks.optuna.optuna_results_analysis.modules",
    "floatsom_benchmarks.optuna.optuna_results_analysis.modules.core_analysis",
    "floatsom_benchmarks.optuna.optuna_results_analysis.modules.overall_score_analysis",
    "floatsom_benchmarks.optuna.optuna_results_analysis.modules.parameter_analysis",
    "floatsom_benchmarks.optuna.optuna_results_analysis.scripts",
    "floatsom_benchmarks.optuna.optuna_results_analysis.scripts.analysis",
    "floatsom_benchmarks.optuna.optuna_results_analysis.scripts.analysis.publication_figures",
    "floatsom_benchmarks.optuna.orchestration",
    "floatsom_benchmarks.optuna.utils",
    "floatsom_benchmarks.speed_benchmarks",
    "floatsom_benchmarks.speed_benchmarks.gpu_scaling"
]

[tool.setuptools.package-dir]
floatsom_benchmarks = "benchmarks"

[tool.setuptools.package-data]
floatsom_benchmarks = ["optuna/config/presets/*.json", "optuna/config/baselines/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
